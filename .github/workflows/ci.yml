name: Verify component system
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm test:mutations
      - run: pnpm build
      - run: pnpm measure:bundle
      - run: pnpm verify:consumer
      - run: pnpm --filter @csl/e2e exec playwright install --with-deps
      - run: pnpm test:e2e
      - run: pnpm --filter @csl/e2e exec playwright test --config consumer.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            coverage/
            packages/e2e/playwright-report/
            packages/e2e/test-results/
            packages/docs/out/
